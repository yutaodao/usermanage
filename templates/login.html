<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 用户管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">用户管理系统</div>
        <div class="nav-menu">
            <a href="/login" class="nav-link">登录</a>
        </div>
    </nav>

    <main class="container">
        <div class="card login-card">
            <h2 class="card-title">用户登录</h2>
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/login" class="login-form">
                <!-- CSRF 保护隐藏字段 -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">登 录</button>
            </form>
            <p style="margin-top: 16px; font-size: 12px; color: #999; text-align: center;">
                连续 5 次失败将锁定 1 分钟 · 所有密码经过哈希保护
            </p>
        </div>
    </main>
</body>
</html>
