{% extends "base.html" %}
{% block title %}个人中心 - 用户管理系统{% endblock %}
{% block content %}
<div class="card">
    <h2 class="card-title">个人中心</h2>
    <ul class="info-list">
        <li><span class="info-label">ID：</span>{{ user.id }}</li>
        <li><span class="info-label">用户名：</span>{{ user.username }}</li>
        <li><span class="info-label">邮箱：</span>{{ user.email }}</li>
        <li><span class="info-label">手机：</span>{{ user.phone }}</li>
        <li><span class="info-label">角色：</span>{{ user.role }}</li>
        <li><span class="info-label">余额：</span>{{ user.balance }}</li>
    </ul>
</div>

<div class="card" style="margin-top: 20px;">
    <h3>充值</h3>
    <form method="POST" action="/recharge" style="margin-top: 12px;">
        <input type="hidden" name="csrf_token" value="{{ session.get('csrf_token', '') }}">
        <div class="form-group">
            <label for="amount">充值金额</label>
            <input type="number" id="amount" name="amount" class="form-input" placeholder="请输入充值金额" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary">充值</button>
    </form>
</div>

<div style="margin-top: 20px; text-align: center;">
    <a href="/" class="btn btn-outline">返回首页</a>
</div>
{% endblock %}
