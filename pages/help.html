<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>帮助中心</title></head>
<body>
    <h2>帮助中心</h2>
    <ul>
        <li><strong>注册：</strong>点击导航栏"注册"，填写用户名、密码、邮箱和手机号即可完成注册。</li>
        <li><strong>登录：</strong>使用已注册的账号和密码登录系统。</li>
        <li><strong>搜索：</strong>登录后可在搜索框输入用户名或邮箱查找用户。</li>
        <li><strong>修改密码：</strong>登录后在首页输入旧密码和新密码进行修改。</li>
        <li><strong>上传头像：</strong>登录后点击"上传头像"，选择图片文件上传。</li>
        <li><strong>个人中心：</strong>登录后查看自己的资料并进行充值。</li>
    </ul>
</body>
</html>
